version: "3.9"

networks:
  telecom-network:
    driver: bridge

volumes:
  qdrant_data:
  delta_data:
  kafka_data:

services:
  # ==========================================
  # PROFILE: CORE (Vector Search + API + UI)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: telecom-qdrant
    profiles: ["core"]
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.5"
    networks:
      - telecom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: telecom-api
    profiles: ["core"]
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./datasets:/app/datasets
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DELTA_STORAGE_PATH=/app/datasets/delta
      - ENVIRONMENT=local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - telecom-network
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: telecom-ui
    profiles: ["core"]
    ports:
      - "8501:8501"
    volumes:
      - ./src/ui:/app/src/ui
      - ./configs:/app/configs
    environment:
      - API_URL=http://api:8000
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    depends_on:
      - api
    networks:
      - telecom-network
    restart: unless-stopped

  # ==========================================
  # PROFILE: STREAMING (Project #2 - Kafka KRaft)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: telecom-kafka
    profiles: ["streaming"]
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms512M -Xmx1024M"
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "1.5"
    networks:
      - telecom-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: telecom-kafka-ui
    profiles: ["streaming"]
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-telecom-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    depends_on:
      - kafka
    networks:
      - telecom-network

